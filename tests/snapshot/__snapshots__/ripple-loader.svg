<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <title>Loading — ripple</title>
  <desc>A solid blue core with three rings rippling outward in a sonar pulse.</desc>
  <style>
    .cv-ripple-1 {
      animation: kf-cv-ripple-1 1.8s ease-out infinite 0s;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes kf-cv-ripple-1 {
      0% { opacity: 0.5; transform: scale(0.4); }
      100% { opacity: 0; transform: scale(1.4); }
    }
    .cv-ripple-2 {
      animation: kf-cv-ripple-2 1.8s ease-out infinite 0.6s;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes kf-cv-ripple-2 {
      0% { opacity: 0.5; transform: scale(0.4); }
      100% { opacity: 0; transform: scale(1.4); }
    }
    .cv-ripple-3 {
      animation: kf-cv-ripple-3 1.8s ease-out infinite 1.2s;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes kf-cv-ripple-3 {
      0% { opacity: 0.5; transform: scale(0.4); }
      100% { opacity: 0; transform: scale(1.4); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
<circle class="cv-ripple-1" cx="40" cy="40" r="20" fill="none" stroke="#0077B6" stroke-width="3"/>
  <circle class="cv-ripple-2" cx="40" cy="40" r="20" fill="none" stroke="#0077B6" stroke-width="3"/>
  <circle class="cv-ripple-3" cx="40" cy="40" r="20" fill="none" stroke="#0077B6" stroke-width="3"/>
  <circle cx="40" cy="40" r="8" fill="#0077B6"/>
</svg>
