<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 90" width="196" height="126">
  <title>Claude character speaking</title>
  <desc>Pixel-art Claude mascot with idle bob, mouth talk loop, expanding sound waves, and floating music notes.</desc>
  <style>
    .cv-bob-1 {
      animation: kf-cv-bob-1 0.8s ease-in-out infinite;
      transform-origin: center bottom;
    }
    @keyframes kf-cv-bob-1 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .cv-shadow-p-2 {
      animation: kf-cv-shadow-p-2 0.8s ease-in-out infinite;
    }
    @keyframes kf-cv-shadow-p-2 {
      0%, 100% { transform: scaleX(1); opacity: 0.25; }
      50% { transform: scaleX(0.9); opacity: 0.2; }
    }
    .cv-talk-3 {
      animation: kf-cv-talk-3 0.3s ease-in-out infinite;
      transform-origin: center center;
    }
    @keyframes kf-cv-talk-3 {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.5); }
    }
    .cv-wave-left-6 {
      animation: kf-cv-wave-left-6 0.8s ease-in-out infinite;
      transform-origin: right center;
    }
    @keyframes kf-cv-wave-left-6 {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-5deg); }
    }
    .cv-wave-right-7 {
      animation: kf-cv-wave-right-7 0.8s ease-in-out infinite;
      transform-origin: left center;
    }
    @keyframes kf-cv-wave-right-7 {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(5deg); }
    }
    .cv-wave-exp-8 {
      animation: kf-cv-wave-exp-8 0.8s ease-out infinite 0s;
      transform-origin: left center;
    }
    @keyframes kf-cv-wave-exp-8 {
      0% { opacity: 0.8; transform: scaleX(0.3) scaleY(0.8); }
      100% { opacity: 0; transform: scaleX(1.2) scaleY(1); }
    }
    .cv-wave-exp-9 {
      animation: kf-cv-wave-exp-9 0.8s ease-out infinite 0.2s;
      transform-origin: left center;
    }
    @keyframes kf-cv-wave-exp-9 {
      0% { opacity: 0.8; transform: scaleX(0.3) scaleY(0.8); }
      100% { opacity: 0; transform: scaleX(1.2) scaleY(1); }
    }
    .cv-wave-exp-10 {
      animation: kf-cv-wave-exp-10 0.8s ease-out infinite 0.4s;
      transform-origin: left center;
    }
    @keyframes kf-cv-wave-exp-10 {
      0% { opacity: 0.8; transform: scaleX(0.3) scaleY(0.8); }
      100% { opacity: 0; transform: scaleX(1.2) scaleY(1); }
    }
    .cv-note-11 {
      animation: kf-cv-note-11 1.5s ease-out infinite 0s;
    }
    @keyframes kf-cv-note-11 {
      0% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
      100% { opacity: 0; transform: translate(15px, -25px) rotate(15deg); }
    }
    .cv-note-12 {
      animation: kf-cv-note-12 1.5s ease-out infinite 0.3s;
    }
    @keyframes kf-cv-note-12 {
      0% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
      100% { opacity: 0; transform: translate(20px, -30px) rotate(-10deg); }
    }
    .cv-note-13 {
      animation: kf-cv-note-13 1.5s ease-out infinite 0.6s;
    }
    @keyframes kf-cv-note-13 {
      0% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
      100% { opacity: 0; transform: translate(10px, -35px) rotate(20deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
<ellipse class="cv-shadow-p-2" cx="50" cy="82" rx="22" ry="5" fill="#000"/>

  <g class="cv-wave-exp-8">
    <path d="M 92 44 Q 100 44, 100 52 Q 100 60, 92 60" fill="none" stroke="#E07C4C" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g class="cv-wave-exp-9">
    <path d="M 96 38 Q 108 38, 108 52 Q 108 66, 96 66" fill="none" stroke="#E07C4C" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g class="cv-wave-exp-10">
    <path d="M 100 32 Q 116 32, 116 52 Q 116 72, 100 72" fill="none" stroke="#E07C4C" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g class="cv-note-11">
    <ellipse cx="108" cy="28" rx="4" ry="3" fill="#E07C4C" transform="rotate(-20, 108, 28)"/>
    <rect x="111" y="12" width="2" height="16" fill="#E07C4C"/>
    <path d="M 113 12 Q 118 14, 118 18 Q 118 22, 113 20" fill="#E07C4C"/>
  </g>
  <g class="cv-note-12">
    <ellipse cx="122" cy="20" rx="4" ry="3" fill="#E07C4C" transform="rotate(-20, 122, 20)"/>
    <rect x="125" y="4" width="2" height="16" fill="#E07C4C"/>
  </g>
  <g class="cv-note-13">
    <ellipse cx="115" cy="40" rx="3" ry="2.5" fill="#E07C4C" transform="rotate(-20, 115, 40)"/>
    <ellipse cx="125" cy="38" rx="3" ry="2.5" fill="#E07C4C" transform="rotate(-20, 125, 38)"/>
    <rect x="117" y="24" width="2" height="16" fill="#E07C4C"/>
    <rect x="127" y="22" width="2" height="16" fill="#E07C4C"/>
    <rect x="117" y="24" width="12" height="2" fill="#E07C4C"/>
  </g>

  <g class="cv-bob-1">
    <rect class="cv-wave-left-6" x="22" y="10" width="8" height="14" fill="#E07C4C"/>
    <rect class="cv-wave-right-7" x="70" y="10" width="8" height="14" fill="#E07C4C"/>
    <rect x="18" y="24" width="64" height="4" fill="#E07C4C"/>
    <rect x="14" y="28" width="72" height="32" fill="#E07C4C"/>
    <rect x="30" y="34" width="8" height="10" fill="#000000"/>
    <rect x="62" y="34" width="8" height="10" fill="#000000"/>
    <rect x="44" y="50" width="12" height="6" fill="#000000"/>
    <rect x="2" y="40" width="12" height="8" fill="#E07C4C"/>
    <rect x="86" y="40" width="12" height="8" fill="#E07C4C"/>
    <rect x="24" y="60" width="12" height="14" fill="#E07C4C"/>
    <rect x="64" y="60" width="12" height="14" fill="#E07C4C"/>
  </g>
</svg>
