<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>Monochrome pulsing logo mark</title>
  <desc>A rounded-square outline and a filled inner square breathing at offset rates, with a shimmering sparkle.</desc>
  <style>
    .cv-pulse-1 {
      animation: kf-cv-pulse-1 3.2s ease-in-out infinite 0s;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes kf-cv-pulse-1 {
      0%, 100% { transform: scale(0.96); }
      50% { transform: scale(1.04); }
    }
    .cv-pulse-2 {
      animation: kf-cv-pulse-2 2.4s ease-in-out infinite 0s;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes kf-cv-pulse-2 {
      0%, 100% { transform: scale(0.86); }
      50% { transform: scale(1.1); }
    }
    .cv-shimmer-3 {
      animation: kf-cv-shimmer-3 4s ease-in-out infinite;
    }
    @keyframes kf-cv-shimmer-3 {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
<rect class="cv-pulse-1" x="46" y="46" width="108" height="108" rx="26" fill="none" stroke="#111111" stroke-width="5"/>
  <rect class="cv-pulse-2" x="78" y="78" width="44" height="44" rx="12" fill="#111111"/>
  <polygon class="cv-shimmer-3" points="150,40 152.8,47.2 160,50 152.8,52.8 150,60 147.2,52.8 140,50 147.2,47.2" fill="#6B6B6B"/>
</svg>
