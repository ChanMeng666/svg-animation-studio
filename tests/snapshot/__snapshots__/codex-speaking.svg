<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="360" height="324">
  <title>Codex character speaking</title>
  <desc>Cloud-shaped Codex mascot with bob, mouth talk, voice rings, glowing sound waves, and floating music notes.</desc>
  <style>
    .cv-bob-1 {
      animation: kf-cv-bob-1 0.8s ease-in-out infinite;
      transform-origin: center bottom;
    }
    @keyframes kf-cv-bob-1 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .cv-shadow-p-2 {
      animation: kf-cv-shadow-p-2 0.8s ease-in-out infinite;
    }
    @keyframes kf-cv-shadow-p-2 {
      0%, 100% { transform: scaleX(1); opacity: 0.25; }
      50% { transform: scaleX(0.9); opacity: 0.2; }
    }
    .cv-talk-3 {
      animation: kf-cv-talk-3 0.3s ease-in-out infinite;
      transform-origin: center center;
    }
    @keyframes kf-cv-talk-3 {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.5); }
    }
    .cv-wave-exp-4 {
      animation: kf-cv-wave-exp-4 0.8s ease-out infinite 0s;
      transform-origin: left center;
    }
    @keyframes kf-cv-wave-exp-4 {
      0% { opacity: 0.8; transform: scaleX(0.3) scaleY(0.8); }
      100% { opacity: 0; transform: scaleX(1.2) scaleY(1); }
    }
    .cv-wave-exp-5 {
      animation: kf-cv-wave-exp-5 0.8s ease-out infinite 0.2s;
      transform-origin: left center;
    }
    @keyframes kf-cv-wave-exp-5 {
      0% { opacity: 0.8; transform: scaleX(0.3) scaleY(0.8); }
      100% { opacity: 0; transform: scaleX(1.2) scaleY(1); }
    }
    .cv-wave-exp-6 {
      animation: kf-cv-wave-exp-6 0.8s ease-out infinite 0.4s;
      transform-origin: left center;
    }
    @keyframes kf-cv-wave-exp-6 {
      0% { opacity: 0.8; transform: scaleX(0.3) scaleY(0.8); }
      100% { opacity: 0; transform: scaleX(1.2) scaleY(1); }
    }
    .cv-note-7 {
      animation: kf-cv-note-7 1.5s ease-out infinite 0s;
    }
    @keyframes kf-cv-note-7 {
      0% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
      100% { opacity: 0; transform: translate(15px, -25px) rotate(15deg); }
    }
    .cv-note-8 {
      animation: kf-cv-note-8 1.5s ease-out infinite 0.3s;
    }
    @keyframes kf-cv-note-8 {
      0% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
      100% { opacity: 0; transform: translate(20px, -30px) rotate(-10deg); }
    }
    .cv-note-9 {
      animation: kf-cv-note-9 1.5s ease-out infinite 0.6s;
    }
    @keyframes kf-cv-note-9 {
      0% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
      100% { opacity: 0; transform: translate(10px, -35px) rotate(20deg); }
    }
    .cv-ring-10 {
      animation: kf-cv-ring-10 0.8s ease-in-out infinite 0s;
      transform-origin: 100px 80px;
    }
    @keyframes kf-cv-ring-10 {
      0%, 100% { opacity: 0.1; transform: scale(1); }
      50% { opacity: 0.25; transform: scale(1.05); }
    }
    .cv-ring-11 {
      animation: kf-cv-ring-11 0.8s ease-in-out infinite 0.2s;
      transform-origin: 100px 80px;
    }
    @keyframes kf-cv-ring-11 {
      0%, 100% { opacity: 0.1; transform: scale(1); }
      50% { opacity: 0.25; transform: scale(1.05); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="cx-body-grad" x1="0.5" y1="0" x2="0.5" y2="1">
          <stop offset="0%" stop-color="#9333EA"/><stop offset="30%" stop-color="#7C3AED"/><stop offset="55%" stop-color="#5B6CF0"/><stop offset="80%" stop-color="#3B9AEE"/><stop offset="100%" stop-color="#22D3EE"/>
        </linearGradient>
        <linearGradient id="cx-arm-l" x1="0" y1="0" x2="1" y2="0.5">
          <stop offset="0%" stop-color="#6D28D9"/><stop offset="50%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#5B21B6"/>
        </linearGradient>
        <linearGradient id="cx-arm-r" x1="0" y1="0" x2="1" y2="0.5">
          <stop offset="0%" stop-color="#7C3AED"/><stop offset="50%" stop-color="#6D28D9"/><stop offset="100%" stop-color="#5B21B6"/>
        </linearGradient>
        <linearGradient id="cx-limb-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7C3AED"/><stop offset="50%" stop-color="#6D28D9"/><stop offset="100%" stop-color="#5B21B6"/>
        </linearGradient>
        <radialGradient id="cx-eye-grad" cx="35%" cy="30%" r="65%">
          <stop offset="0%" stop-color="#FFFFFF"/><stop offset="60%" stop-color="#F0F0F0"/><stop offset="100%" stop-color="#D8D8D8"/>
        </radialGradient>
        <radialGradient id="cx-shadow-grad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#4C1D95" stop-opacity="0.35"/><stop offset="60%" stop-color="#4C1D95" stop-opacity="0.15"/><stop offset="100%" stop-color="#4C1D95" stop-opacity="0"/>
        </radialGradient>
        <filter id="cx-drop-shadow" x="-15%" y="-15%" width="130%" height="140%">
          <feDropShadow dx="2" dy="3.5" stdDeviation="2.5" flood-color="#4C1D95" flood-opacity="0.3"/>
        </filter>
        <filter id="cx-inner-depth" x="-5%" y="-5%" width="110%" height="110%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
          <feOffset dx="0" dy="2" result="off"/>
          <feFlood flood-color="#3B0764" flood-opacity="0.25" result="color"/>
          <feComposite in="color" in2="off" operator="in" result="shadow"/>
          <feMerge>
            <feMergeNode in="shadow"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <clipPath id="cx-cloud-clip">
          <circle cx="128" cy="68" r="56"/>
          <circle cx="192" cy="100" r="54"/>
          <circle cx="188" cy="168" r="54"/>
          <circle cx="128" cy="192" r="54"/>
          <circle cx="68" cy="168" r="54"/>
          <circle cx="64" cy="100" r="54"/>
          <circle cx="128" cy="130" r="60"/>
        </clipPath>
        <filter id="cx-sound-glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="1.5" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <filter id="cx-note-glow" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="2" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
  </defs>
<ellipse class="cv-shadow-p-2" cx="68" cy="162" rx="28" ry="6" fill="url(#cx-shadow-grad)"/>

  <g class="cv-bob-1" filter="url(#cx-drop-shadow)">
    <g>
    <g transform="translate(12, 20) scale(0.44)" filter="url(#cx-inner-depth)">
      <rect x="0" y="0" width="256" height="256" fill="url(#cx-body-grad)" clip-path="url(#cx-cloud-clip)"/>
    </g>
    <rect x="22" y="30" width="22" height="12" fill="#C4B5FD" opacity="0.2" rx="3"/>
    <rect x="25" y="33" width="12" height="6" fill="#DDD6FE" opacity="0.15" rx="2"/>
    <line x1="46" y1="92" x2="55" y2="102" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <line x1="55" y1="102" x2="46" y2="112" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <line x1="62" y1="112" x2="80" y2="112" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <rect x="36" y="62" width="14" height="20" rx="4" fill="url(#cx-eye-grad)" stroke="#4C1D95" stroke-width="2"/>
    <rect x="38" y="64" width="4" height="4" fill="#fff" opacity="0.8" rx="1"/>
    <rect x="44" y="74" width="2" height="2" fill="#fff" opacity="0.35" rx="0.5"/>
    <circle cx="43" cy="74" r="3.5" fill="#4C1D95" opacity="0.7"/>
    <rect x="70" y="62" width="14" height="20" rx="4" fill="url(#cx-eye-grad)" stroke="#4C1D95" stroke-width="2"/>
    <rect x="72" y="64" width="4" height="4" fill="#fff" opacity="0.8" rx="1"/>
    <rect x="78" y="74" width="2" height="2" fill="#fff" opacity="0.35" rx="0.5"/>
    <circle cx="77" cy="74" r="3.5" fill="#4C1D95" opacity="0.7"/>
    <ellipse cx="68" cy="95" rx="8" ry="5" fill="#3B0764" opacity="0.8"/>
    <ellipse cx="68" cy="93.5" rx="5" ry="1.5" fill="#6D28D9" opacity="0.3"/>
    <g>
      <rect x="4" y="76" width="20" height="10" rx="4" fill="url(#cx-arm-l)"/>
      <rect x="6" y="78" width="7" height="3.5" fill="#A78BFA" opacity="0.25" rx="1"/>
    </g>
    <g>
      <rect x="110" y="76" width="20" height="10" rx="4" fill="url(#cx-arm-r)"/>
      <rect x="112" y="78" width="7" height="3.5" fill="#A78BFA" opacity="0.25" rx="1"/>
    </g>
    <rect x="40" y="132" width="14" height="24" rx="4" fill="url(#cx-limb-grad)"/>
    <rect x="42" y="134" width="5" height="12" fill="#A78BFA" opacity="0.25" rx="1"/>
    <rect x="82" y="132" width="14" height="24" rx="4" fill="url(#cx-limb-grad)"/>
    <rect x="84" y="134" width="5" height="12" fill="#A78BFA" opacity="0.25" rx="1"/>
  </g>
  </g>

  <circle class="cv-ring-10" cx="100" cy="80" r="32" fill="none" stroke="#A78BFA" stroke-width="1.2" opacity="0.12"/>
  <circle class="cv-ring-11" cx="100" cy="80" r="40" fill="none" stroke="#8B5CF6" stroke-width="0.8" opacity="0.08"/>

  <g filter="url(#cx-sound-glow)">
    <path class="cv-wave-exp-4" d="M84,88 Q96,80 84,72" fill="none" stroke="#C4B5FD" stroke-width="2.5" stroke-linecap="round"/>
    <path class="cv-wave-exp-5" d="M88,92 Q104,80 88,68" fill="none" stroke="#A78BFA" stroke-width="2.2" stroke-linecap="round"/>
    <path class="cv-wave-exp-6" d="M92,96 Q112,80 92,64" fill="none" stroke="#8B5CF6" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <g class="cv-note-7" filter="url(#cx-note-glow)">
    <circle cx="96" cy="84" r="3" fill="#C4B5FD"/>
    <line x1="99" y1="84" x2="99" y2="74" stroke="#C4B5FD" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M99,74 Q103,72.5 101.5,76" fill="#C4B5FD" stroke="none"/>
  </g>
  <g class="cv-note-8" filter="url(#cx-note-glow)">
    <circle cx="93" cy="88" r="2.5" fill="#A78BFA"/>
    <line x1="95.5" y1="88" x2="95.5" y2="80" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M95.5,80 Q99,78.5 97.5,82" fill="#A78BFA" stroke="none"/>
  </g>
  <g class="cv-note-9" filter="url(#cx-note-glow)">
    <circle cx="98" cy="90" r="2.5" fill="#8B5CF6"/>
    <circle cx="105" cy="88" r="2.5" fill="#8B5CF6"/>
    <line x1="100.5" y1="90" x2="100.5" y2="81" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="107.5" y1="88" x2="107.5" y2="79" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="100.5" y1="81" x2="107.5" y2="79" stroke="#8B5CF6" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
