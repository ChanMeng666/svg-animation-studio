<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <title>Accent card</title>
  <desc>A cream canvas with a dashed-outline card and six small brand accent squares scattered in the margins, each drifting on its own rhythm.</desc>
  <style>
    .cv-drift-1 {
      animation: kf-cv-drift-1 4.06s ease-in-out infinite 0.20s;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes kf-cv-drift-1 {
      0%, 100% { transform: translateY(0) rotate(3deg); }
      50% { transform: translateY(-5px) rotate(-3deg); }
    }
    .cv-drift-2 {
      animation: kf-cv-drift-2 4.10s ease-in-out infinite 0.92s;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes kf-cv-drift-2 {
      0%, 100% { transform: translateY(0) rotate(-8deg); }
      50% { transform: translateY(-5px) rotate(8deg); }
    }
    .cv-drift-3 {
      animation: kf-cv-drift-3 5.13s ease-in-out infinite 0.38s;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes kf-cv-drift-3 {
      0%, 100% { transform: translateY(0) rotate(7deg); }
      50% { transform: translateY(-6px) rotate(-7deg); }
    }
    .cv-drift-4 {
      animation: kf-cv-drift-4 2.85s ease-in-out infinite 0.78s;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes kf-cv-drift-4 {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-5px) rotate(1deg); }
    }
    .cv-drift-5 {
      animation: kf-cv-drift-5 4.32s ease-in-out infinite 0.20s;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes kf-cv-drift-5 {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    .cv-drift-6 {
      animation: kf-cv-drift-6 5.17s ease-in-out infinite 0.94s;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes kf-cv-drift-6 {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-11px) rotate(4deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
<rect width="200" height="120" fill="#F7F6F2"/>
  <rect x="16" y="16" width="168" height="88" rx="18" fill="none" stroke="#070607" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>
  <rect class="cv-drift-1" x="4" y="6" width="10" height="10" fill="#FC5000"/>
<rect class="cv-drift-2" x="96" y="2" width="10" height="10" fill="#524AE9"/>
<rect class="cv-drift-3" x="186" y="6" width="10" height="10" fill="#F5F28E"/>
<rect class="cv-drift-4" x="4" y="102" width="10" height="10" fill="#FC5000"/>
<rect class="cv-drift-5" x="100" y="106" width="10" height="10" fill="#524AE9"/>
<rect class="cv-drift-6" x="186" y="100" width="10" height="10" fill="#F5F28E"/>
</svg>
