<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
  <title>Film strip and cross-fade</title>
  <desc>Two framed pictures. The left one steps through twelve embedded frames like a film strip; the right one cross-fades from its first still to its last.</desc>
  <style>
    @keyframes fs-strip-film{0%,6.667%{transform:translateY(0);animation-timing-function:steps(11,end)}56.667%,100%{transform:translateY(-1650px)}}
    .fs-strip-film{transform:translateY(-1650px);animation:fs-strip-film 6s linear infinite}
    @keyframes fs-still-s1{0%,60.000%{opacity:0}67.500%,100%{opacity:1}}
    .fs-still-s1{animation:fs-still-s1 6s linear infinite}
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <clipPath id="fs-strip"><rect x="30" y="25" width="120" height="150" rx="10"/></clipPath>
    <clipPath id="fs-still"><rect x="210" y="25" width="120" height="150" rx="10"/></clipPath>
  </defs>
<rect width="360" height="200" fill="#E2E2DF"/>
  <g clip-path="url(#fs-strip)"><g transform="translate(30 25)"><g class="fs-strip-film"><image y="0" width="120" height="150" preserveAspectRatio="xMidYMid slice" href="data:image/svg+xml;base64,"/><image y="150" width="120" height="150" preserveAspectRatio="xMidYMid slice" href="data:image/svg+xml;base64,"/><image y="300" width="120" height="150" preserveAspectRatio="xMidYMid slice" href="data:image/svg+xml;base64,"/><image y="450" width="120" height="150" preserveAspectRatio="xMidYMid slice" href="data:image/svg+xml;base64,"/><image y="600" width="120" height="150" preserveAspectRatio="xMidYMid slice" href="data:image/svg+xml;base64,"/><image y="750" width="120" height="150" preserveAspectRatio="xMidYMid slice" href="data:image/svg+xml;base64,"/><image y="900" width="120" height="150" preserveAspectRatio="xMidYMid slice" href="data:image/svg+xml;base64,"/><image y="1050" width="120" height="150" preserveAspectRatio="xMidYMid slice" href="data:image/svg+xml;base64,"/><image y="1200" width="120" height="150" preserveAspectRatio="xMidYMid slice" href="data:image/svg+xml;base64,"/><image y="1350" width="120" height="150" preserveAspectRatio="xMidYMid slice" href="data:image/svg+xml;base64,"/><image y="1500" width="120" height="150" preserveAspectRatio="xMidYMid slice" href="data:image/svg+xml;base64,"/><image y="1650" width="120" height="150" preserveAspectRatio="xMidYMid slice" href="data:image/svg+xml;base64,"/></g></g></g>
  <rect x="30" y="25" width="120" height="150" rx="10" fill="none" stroke="#070607" stroke-width="1" stroke-opacity=".25"/>
  <g clip-path="url(#fs-still)"><image x="210" y="25" width="120" height="150" preserveAspectRatio="xMidYMid slice" href="data:image/svg+xml;base64,"/><image class="fs-still-s1" x="210" y="25" width="120" height="150" preserveAspectRatio="xMidYMid slice" href="data:image/svg+xml;base64,"/></g>
  <rect x="210" y="25" width="120" height="150" rx="10" fill="none" stroke="#070607" stroke-width="1" stroke-opacity=".25"/>
</svg>
