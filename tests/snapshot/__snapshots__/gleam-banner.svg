<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" width="360" height="120">
  <title>Gleam banner</title>
  <desc>Three bold bars with a soft white gleam sweeping across them on a loop.</desc>
  <style>
    .cv-sweep-1 {
      animation: kf-cv-sweep-1 4s linear infinite 0.5s;
    }
    @keyframes kf-cv-sweep-1 {
      0%, 55% { transform: translateX(0); }
      100% { transform: translateX(460px); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="gb-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="gb-clip"><path d="M40 30 h50 v60 h-50 Z M155 30 h50 v60 h-50 Z M270 30 h50 v60 h-50 Z"/></clipPath>
  </defs>
<rect x="0" y="0" width="360" height="120" rx="0" fill="#E2E2DF"/>
  <path d="M40 30 h50 v60 h-50 Z M155 30 h50 v60 h-50 Z M270 30 h50 v60 h-50 Z" fill="#524AE9"/>
  <g clip-path="url(#gb-clip)"><g class="cv-sweep-1"><rect x="-90" y="-10" width="84" height="140" fill="url(#gb-grad)" transform="rotate(16 -48 60)"/></g></g>
</svg>
